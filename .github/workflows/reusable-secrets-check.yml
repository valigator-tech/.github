# Reusable Secrets Detection
# Called by each repo's pr-checks.yml
#
# Runs: gitleaks CLI (open-source) to detect committed secrets/credentials
# Uses the CLI directly instead of gitleaks-action (which requires a paid
# license for organizations).
#
# No inputs required — always runs with default config
#
# Supply-chain hardening (GATOR-3555):
#   - gitleaks is pinned to one version and its tarball is checked against a
#     sha256 HARDCODED below (not the release's own checksums file, which an
#     attacker who controls the release could replace too). A mismatch fails
#     the job before anything is extracted.
#   - actions/checkout is pinned to a commit SHA, and the job token is not
#     persisted into .git/config.
#   - The SARIF upload step was removed: no caller grants the job
#     `security-events: write` (callers grant `contents: read`, and the org
#     default token is read-only), so it failed on every run behind
#     `continue-on-error`. Findings are reported in the job log (--verbose
#     --redact) and the job fails on a hit, as before.
#
# Bumping gitleaks (manual; Dependabot does not track it):
#   1. Pick a stable release at least 7 days old:
#        gh api repos/gitleaks/gitleaks/releases --jq '.[] | .tag_name+" "+.published_at'
#   2. Take the linux_x64 tarball's sha256 from TWO sources and check they match:
#        gh api repos/gitleaks/gitleaks/releases/tags/vX.Y.Z \
#          --jq '.assets[] | select(.name|endswith("_linux_x64.tar.gz")) | .digest'
#        curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/vX.Y.Z/gitleaks_X.Y.Z_linux_x64.tar.gz
#        sha256sum gitleaks_X.Y.Z_linux_x64.tar.gz   # (macOS: shasum -a 256)
#   3. Update GITLEAKS_VERSION and GITLEAKS_SHA256 together, in a reviewed PR.
# actions/checkout is bumped by Dependabot (.github/dependabot.yml), which
# updates the SHA and its version comment.
#
# Regression test: self-test-secrets-check.yml (lint, fail-closed install, smoke).

name: Secrets Check

on:
  workflow_call:

jobs:
  secrets-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Full history for scanning
          persist-credentials: false

      - name: Install Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          dldir="${RUNNER_TEMP}/gitleaks-download"
          bindir="${RUNNER_TEMP}/gitleaks/bin"
          mkdir -p "${dldir}"
          cd "${dldir}"
          curl -fsSL --proto '=https' --proto-redir '=https' --tlsv1.2 --retry 3 -o "${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          # The install dir is created only after the hash check passes.
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check --strict -
          mkdir -p "${bindir}"
          tar -xzf "${tarball}" -C "${bindir}" --no-same-owner gitleaks
          chmod 0755 "${bindir}/gitleaks"
          echo "${bindir}" >> "${GITHUB_PATH}"

      - name: Run Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          gitleaks version
          gitleaks detect --source . --verbose --redact --report-format sarif --report-path gitleaks-report.sarif
